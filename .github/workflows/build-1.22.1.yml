name: Compilar ArlightBosses 1.22.1

on:
  workflow_dispatch:
  push:
    branches:
      - feature/1.22.1-medal-render-gate-animation
    paths:
      - '.github/workflows/build-1.22.1.yml'
      - '.github/import/1221.patch.gz.b64.part*'
      - 'src/**'
      - 'build.gradle'
      - 'gradle.properties'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Descargar rama candidata
        uses: actions/checkout@v4
        with:
          ref: feature/1.22.1-medal-render-gate-animation
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Aplicar y validar corrección 1.22.1
        shell: bash
        run: |
          set -euo pipefail
          cat .github/import/1221.patch.gz.b64.part* | base64 -d | gzip -d > /tmp/1221.patch
          if ! grep -q "version = '1.22.1'" build.gradle; then
            git apply --binary /tmp/1221.patch
          fi
          grep -q "version = '1.22.1'" build.gradle
          grep -q 'class CampaignMedalItem' src/main/java/com/arlight/bosses/item/CampaignMedalItem.java
          grep -q 'class MedalPedestalBlockItem' src/main/java/com/arlight/bosses/item/MedalPedestalBlockItem.java
          grep -q 'visualStateTicks' src/main/java/com/arlight/bosses/block/entity/MedalPedestalBlockEntity.java
          test -f src/main/resources/assets/arlightbosses/geo/campaign_medal.geo.json
          test -f src/main/resources/assets/arlightbosses/textures/item/mossbound_home_medal.png
          test -f src/main/resources/assets/arlightbosses/textures/item/gilded_trade_medal.png
          test -f src/main/resources/assets/arlightbosses/textures/item/emerald_bastion_medal.png
          python3 -m json.tool src/main/resources/assets/arlightbosses/geo/campaign_medal.geo.json >/dev/null
          python3 -m json.tool src/main/resources/assets/arlightbosses/animations/campaign_medal.animation.json >/dev/null
          git diff --check

      - name: Guardar fuente 1.22.1 en la rama
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build.gradle BUILD_VERSION.txt SOURCE_VERSION.txt CAMBIOS_1.22.1.txt src/main/java src/main/resources
          if ! git diff --cached --quiet; then
            git commit -m 'ArlightBosses 1.22.1: render GeckoLib de medallas y pedestales'
            git push origin HEAD:feature/1.22.1-medal-render-gate-animation
          fi

      - name: Compilar con Gradle
        run: gradle --no-daemon clean build

      - name: Verificar JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name 'ArlightBosses-1.22.1*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          test -n "$JAR"
          unzip -p "$JAR" META-INF/neoforge.mods.toml | grep -q 'version="1.22.1"'
          jar tf "$JAR" | grep -q 'com/arlight/bosses/item/CampaignMedalItem.class'
          jar tf "$JAR" | grep -q 'com/arlight/bosses/item/MedalPedestalBlockItem.class'
          jar tf "$JAR" | grep -q 'com/arlight/bosses/client/CampaignMedalRenderer.class'
          jar tf "$JAR" | grep -q 'assets/arlightbosses/geo/campaign_medal.geo.json'
          jar tf "$JAR" | grep -q 'assets/arlightbosses/textures/item/mossbound_home_medal.png'

      - name: Reunir entregables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/source
          JAR="$(find build/libs -maxdepth 1 -type f -name 'ArlightBosses-1.22.1*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          cp "$JAR" dist/ArlightBosses-1.22.1.jar
          rsync -a --exclude '.git/' --exclude '.gradle/' --exclude 'build/' --exclude 'dist/' ./ dist/source/
          (cd dist/source && zip -qr ../ArlightBosses-1.22.1-SOURCE.zip .)
          sha256sum dist/ArlightBosses-1.22.1.jar dist/ArlightBosses-1.22.1-SOURCE.zip > dist/ArlightBosses-1.22.1-SHA256.txt

      - name: Subir JAR
        uses: actions/upload-artifact@v4
        with:
          name: ArlightBosses-1.22.1-JAR
          path: dist/ArlightBosses-1.22.1.jar
          if-no-files-found: error
          retention-days: 30

      - name: Subir fuente y hashes
        uses: actions/upload-artifact@v4
        with:
          name: ArlightBosses-1.22.1-SOURCE
          path: |
            dist/ArlightBosses-1.22.1-SOURCE.zip
            dist/ArlightBosses-1.22.1-SHA256.txt
          if-no-files-found: error
          retention-days: 30
