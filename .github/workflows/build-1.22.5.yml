name: Compilar ArlightBosses 1.22.5

on:
  workflow_dispatch:
  push:
    branches:
      - fix/1.22.5-pedestal-medal-culling-joint-animation
    paths:
      - '.github/workflows/build-1.22.5.yml'
      - '.github/import/1224.patch.gz.b64.part*'
      - '.github/import/1225.patch.gz.b64'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/build-1.22.5.yml'
      - '.github/import/1224.patch.gz.b64.part*'
      - '.github/import/1225.patch.gz.b64'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Descargar rama
        uses: actions/checkout@v4
        with:
          ref: fix/1.22.5-pedestal-medal-culling-joint-animation
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Aplicar 1.22.4 y corrección 1.22.5
        shell: bash
        run: |
          set -euo pipefail
          cat .github/import/1224.patch.gz.b64.part* | base64 -d | gzip -d > /tmp/1224.patch
          if ! grep -Fq "version = '1.22.4'" build.gradle; then
            git apply --binary /tmp/1224.patch
          fi
          base64 -d .github/import/1225.patch.gz.b64 | gzip -d > /tmp/1225.patch
          git apply /tmp/1225.patch

          grep -Fq "version = '1.22.5'" build.gradle
          test "$(tr -d '\r\n' < BUILD_VERSION.txt)" = '1.22.5'
          grep -Fq 'PEDESTAL-MEDAL-ENTITY-JOINT-RITUAL' SOURCE_VERSION.txt
          grep -Fq 'ItemEntity' src/main/java/com/arlight/bosses/block/entity/MedalPedestalBlockEntity.java
          grep -Fq 'renderJointBeams' src/main/java/com/arlight/bosses/block/entity/MedalPedestalBlockEntity.java
          grep -Fq 'shouldRenderOffScreen' src/main/java/com/arlight/bosses/client/MedalPedestalRenderer.java
          git diff --check

      - name: Compilar con Gradle
        run: gradle --no-daemon clean build

      - name: Verificar JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name 'ArlightBosses-1.22.5*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          test -n "$JAR"
          test "$(basename "$JAR")" = 'ArlightBosses-1.22.5.jar'
          unzip -tqq "$JAR"
          jar tf "$JAR" > /tmp/jar-contents.txt
          grep -Fxq 'com/arlight/bosses/block/entity/MedalPedestalBlockEntity.class' /tmp/jar-contents.txt
          grep -Fxq 'com/arlight/bosses/client/MedalPedestalRenderer.class' /tmp/jar-contents.txt
          grep -Fxq 'assets/arlightbosses/textures/item/mossbound_home_medal.png' /tmp/jar-contents.txt
          grep -Fxq 'assets/arlightbosses/textures/item/gilded_trade_medal.png' /tmp/jar-contents.txt
          grep -Fxq 'assets/arlightbosses/textures/item/emerald_bastion_medal.png' /tmp/jar-contents.txt

      - name: Reunir entregables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/source
          JAR="$(find build/libs -maxdepth 1 -type f -name 'ArlightBosses-1.22.5*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          cp "$JAR" dist/ArlightBosses-1.22.5.jar
          rsync -a --exclude '.git/' --exclude '.gradle/' --exclude 'build/' --exclude 'dist/' --exclude '.github/import/' ./ dist/source/
          (cd dist/source && zip -qr ../ArlightBosses-1.22.5-SOURCE.zip .)
          sha256sum dist/ArlightBosses-1.22.5.jar dist/ArlightBosses-1.22.5-SOURCE.zip > dist/ArlightBosses-1.22.5-SHA256.txt

      - name: Subir JAR
        uses: actions/upload-artifact@v4
        with:
          name: ArlightBosses-1.22.5-JAR
          path: dist/ArlightBosses-1.22.5.jar
          if-no-files-found: error
          retention-days: 30

      - name: Subir fuente y hash
        uses: actions/upload-artifact@v4
        with:
          name: ArlightBosses-1.22.5-SOURCE
          path: |
            dist/ArlightBosses-1.22.5-SOURCE.zip
            dist/ArlightBosses-1.22.5-SHA256.txt
          if-no-files-found: error
          retention-days: 30
