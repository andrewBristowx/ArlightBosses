name: Compilar ArlightBosses 1.22.6

on:
  workflow_dispatch:
  push:
    branches:
      - fix/1.22.6-dedicated-medal-display
    paths:
      - '.github/workflows/build-1.22.6.yml'
      - '.github/import/1226.patch.gz.b64'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Descargar rama
        uses: actions/checkout@v4
        with:
          ref: fix/1.22.6-dedicated-medal-display
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Aplicar fuentes 1.22.4, 1.22.5 y 1.22.6
        shell: bash
        run: |
          set -euo pipefail
          cat .github/import/1224.patch.gz.b64.part* | base64 -d | gzip -d > /tmp/1224.patch
          if ! grep -Fq "version = '1.22.4'" build.gradle; then
            git apply --binary /tmp/1224.patch
          fi
          base64 -d .github/import/1225.patch.gz.b64 | gzip -d > /tmp/1225.patch
          if ! grep -Fq "version = '1.22.5'" build.gradle; then
            git apply /tmp/1225.patch
          fi
          base64 -d .github/import/1226.patch.gz.b64 | gzip -d > /tmp/1226.patch
          git apply /tmp/1226.patch

          grep -Fq "version = '1.22.6'" build.gradle
          test "$(tr -d '\r\n' < BUILD_VERSION.txt)" = '1.22.6'
          grep -Fq 'DEDICATED-PEDESTAL-MEDAL-DISPLAY-ENTITY' SOURCE_VERSION.txt
          grep -Fq 'class PedestalMedalDisplayEntity' src/main/java/com/arlight/bosses/entity/PedestalMedalDisplayEntity.java
          grep -Fq 'PEDESTAL_MEDAL_DISPLAY' src/main/java/com/arlight/bosses/entity/BossEntities.java
          grep -Fq 'PedestalMedalDisplayRenderer' src/main/java/com/arlight/bosses/client/BossClientEvents.java
          git diff --check

      - name: Compilar con Gradle
        run: gradle --no-daemon clean build

      - name: Verificar JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name 'ArlightBosses-1.22.6*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          test -n "$JAR"
          test "$(basename "$JAR")" = 'ArlightBosses-1.22.6.jar'
          unzip -tqq "$JAR"
          jar tf "$JAR" > /tmp/jar-contents.txt
          grep -Fxq 'com/arlight/bosses/entity/PedestalMedalDisplayEntity.class' /tmp/jar-contents.txt
          grep -Fxq 'com/arlight/bosses/client/PedestalMedalDisplayRenderer.class' /tmp/jar-contents.txt
          grep -Fxq 'com/arlight/bosses/client/PedestalMedalDisplayModel.class' /tmp/jar-contents.txt
          grep -Fxq 'assets/arlightbosses/animations/pedestal_medal_display.animation.json' /tmp/jar-contents.txt
          grep -Fxq 'assets/arlightbosses/textures/item/mossbound_home_medal.png' /tmp/jar-contents.txt
          grep -Fxq 'assets/arlightbosses/textures/item/gilded_trade_medal.png' /tmp/jar-contents.txt
          grep -Fxq 'assets/arlightbosses/textures/item/emerald_bastion_medal.png' /tmp/jar-contents.txt

      - name: Reunir entregables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/source
          JAR="$(find build/libs -maxdepth 1 -type f -name 'ArlightBosses-1.22.6*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          cp "$JAR" dist/ArlightBosses-1.22.6.jar
          rsync -a --exclude '.git/' --exclude '.gradle/' --exclude 'build/' --exclude 'dist/' --exclude '.github/import/' ./ dist/source/
          (cd dist/source && zip -qr ../ArlightBosses-1.22.6-SOURCE.zip .)
          sha256sum dist/ArlightBosses-1.22.6.jar dist/ArlightBosses-1.22.6-SOURCE.zip > dist/ArlightBosses-1.22.6-SHA256.txt

      - name: Subir JAR
        uses: actions/upload-artifact@v4
        with:
          name: ArlightBosses-1.22.6-JAR
          path: dist/ArlightBosses-1.22.6.jar
          if-no-files-found: error
          retention-days: 30

      - name: Subir fuente y hash
        uses: actions/upload-artifact@v4
        with:
          name: ArlightBosses-1.22.6-SOURCE
          path: |
            dist/ArlightBosses-1.22.6-SOURCE.zip
            dist/ArlightBosses-1.22.6-SHA256.txt
          if-no-files-found: error
          retention-days: 30
