name: Compilar ArlightBosses 1.22.8

on:
  workflow_dispatch:
  push:
    branches:
      - fix/1.22.8-surface-guardian-cinematic-music
    paths:
      - '.github/workflows/build-1.22.8.yml'
      - '.github/import/1228v2.part*'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/build-1.22.8.yml'
      - '.github/import/1228v2.part*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Descargar rama
        uses: actions/checkout@v4
        with:
          ref: fix/1.22.8-surface-guardian-cinematic-music
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Aplicar fuentes hasta 1.22.8
        shell: bash
        run: |
          set -euxo pipefail
          cat .github/import/1224.patch.gz.b64.part* | base64 -d | gzip -d > /tmp/1224.patch
          if ! grep -Fq "version = '1.22.4'" build.gradle; then git apply --binary /tmp/1224.patch; fi
          base64 -d .github/import/1225.patch.gz.b64 | gzip -d > /tmp/1225.patch
          if ! grep -Fq "version = '1.22.5'" build.gradle; then git apply /tmp/1225.patch; fi
          base64 -d .github/import/1226.patch.gz.b64 | gzip -d > /tmp/1226.patch
          if ! grep -Fq "version = '1.22.6'" build.gradle; then git apply /tmp/1226.patch; fi
          base64 -d .github/import/1227.patch.gz.b64 | gzip -d > /tmp/1227.patch
          git apply /tmp/1227.patch
          cat .github/import/1228v2.part00 .github/import/1228v2.part01 .github/import/1228v2.part02 .github/import/1228v2.part03 .github/import/1228v2.part04 .github/import/1228v2.part05 > /tmp/1228.b64
          base64 -d /tmp/1228.b64 | gzip -d > /tmp/1228.patch
          git apply /tmp/1228.patch

          grep -Fq "version = '1.22.8'" build.gradle
          test "$(tr -d '\r\n' < BUILD_VERSION.txt)" = '1.22.8'
          test -f src/main/java/com/arlight/bosses/integration/SurfaceGuardianEncounterManager.java
          test -f src/main/java/com/arlight/bosses/network/SurfaceGuardianCuePayload.java
          test -f src/main/java/com/arlight/bosses/network/BossNetworking.java
          test -f src/main/java/com/arlight/bosses/client/cinematic/SurfaceGuardianCinematicClient.java
          git diff --check

      - name: Compilar con Gradle
        run: gradle --no-daemon clean build

      - name: Verificar JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name 'ArlightBosses-1.22.8*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          test -n "$JAR"
          test "$(basename "$JAR")" = 'ArlightBosses-1.22.8.jar'
          unzip -tqq "$JAR"
          jar tf "$JAR" > /tmp/jar-contents.txt
          grep -Fxq 'com/arlight/bosses/integration/SurfaceGuardianEncounterManager.class' /tmp/jar-contents.txt
          grep -Fxq 'com/arlight/bosses/network/SurfaceGuardianCuePayload.class' /tmp/jar-contents.txt
          grep -Fxq 'com/arlight/bosses/network/BossNetworking.class' /tmp/jar-contents.txt
          grep -Fxq 'com/arlight/bosses/client/cinematic/SurfaceGuardianCinematicClient.class' /tmp/jar-contents.txt
          grep -Fxq 'com/arlight/bosses/entity/SurfaceGuardian.class' /tmp/jar-contents.txt

      - name: Reunir entregables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/source
          JAR="$(find build/libs -maxdepth 1 -type f -name 'ArlightBosses-1.22.8*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          cp "$JAR" dist/ArlightBosses-1.22.8.jar
          rsync -a --exclude '.git/' --exclude '.gradle/' --exclude 'build/' --exclude 'dist/' --exclude '.github/import/' ./ dist/source/
          (cd dist/source && zip -qr ../ArlightBosses-1.22.8-SOURCE.zip .)
          sha256sum dist/ArlightBosses-1.22.8.jar dist/ArlightBosses-1.22.8-SOURCE.zip > dist/ArlightBosses-1.22.8-SHA256.txt

      - name: Subir JAR
        uses: actions/upload-artifact@v4
        with:
          name: ArlightBosses-1.22.8-JAR
          path: dist/ArlightBosses-1.22.8.jar
          if-no-files-found: error
          retention-days: 30

      - name: Subir fuente y hash
        uses: actions/upload-artifact@v4
        with:
          name: ArlightBosses-1.22.8-SOURCE
          path: |
            dist/ArlightBosses-1.22.8-SOURCE.zip
            dist/ArlightBosses-1.22.8-SHA256.txt
          if-no-files-found: error
          retention-days: 30
