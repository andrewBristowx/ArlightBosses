name: Build ArlightTetris 0.5.0 Clean

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'arlighttetris050clean/**'
      - '.github/workflows/build-arlighttetris-050-clean.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Reconstruct clean source
        shell: bash
        run: |
          set -euo pipefail
          mkdir project
          cat arlighttetris050clean/source.b64.* | base64 -d > /tmp/arlighttetris-text.tar.gz
          echo '168a880fded16f94c7e30f14d6554420d58f1a7c6dabc95465b4133efffbd812  /tmp/arlighttetris-text.tar.gz' | sha256sum -c -
          tar -xzf /tmp/arlighttetris-text.tar.gz -C project
          mkdir -p project/src/main/resources/assets/arlighttetris/textures/gui
          base64 -d > project/src/main/resources/assets/arlighttetris/textures/gui/tetris_waiting_background.png <<'PNG'
          iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=
          PNG
          test -f project/build.gradle
          grep -q "version = '0.5.0'" project/build.gradle

      - name: Build
        working-directory: project
        shell: bash
        run: gradle --no-daemon clean build --stacktrace

      - name: Verify final JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find project/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*javadoc*' | head -n 1)"
          test -n "$JAR"
          unzip -p "$JAR" META-INF/neoforge.mods.toml | grep -Eq 'version[[:space:]]*=[[:space:]]*"0\.5\.0"'
          jar tf "$JAR" | grep -q 'com/arlight/tetris/world/TetrisArenaBuilder.class'
          jar tf "$JAR" | grep -q 'com/arlight/tetris/world/ArenaMatchListener.class'
          jar tf "$JAR" | grep -q 'com/arlight/tetris/world/ArenaDisplayManager.class'
          jar tf "$JAR" | grep -q 'com/arlight/tetris/stats/TetrisStatsStore.class'
          cp "$JAR" ArlightTetris-0.5.0.jar
          sha256sum ArlightTetris-0.5.0.jar

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ArlightTetris-0.5.0
          path: ArlightTetris-0.5.0.jar
          if-no-files-found: error
          retention-days: 7
