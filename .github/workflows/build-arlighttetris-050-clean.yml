name: Build ArlightTetris 0.5.0 Clean

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/build-arlighttetris-050-clean.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Download clean source ZIP
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet gdown
          gdown --id 1wsHFeVmmR6q9p8Au2GlOiOfdUXGs9Csr -O ArlightTetris-0.5.0-SOURCE.zip
          test -s ArlightTetris-0.5.0-SOURCE.zip
          echo 'c5d7f6f2d06eaef488b249085d29b2b72cb84ef760e244cf372aa8be58f20408  ArlightTetris-0.5.0-SOURCE.zip' | sha256sum -c -
          mkdir project
          unzip -q ArlightTetris-0.5.0-SOURCE.zip -d project
          test -f project/build.gradle
          grep -q "version = '0.5.0'" project/build.gradle

      - name: Build
        working-directory: project
        shell: bash
        run: gradle --no-daemon clean build --stacktrace

      - name: Verify final JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find project/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*javadoc*' | head -n 1)"
          test -n "$JAR"
          unzip -p "$JAR" META-INF/neoforge.mods.toml | grep -Eq 'version[[:space:]]*=[[:space:]]*"0\.5\.0"'
          jar tf "$JAR" | grep -q 'com/arlight/tetris/world/TetrisArenaBuilder.class'
          jar tf "$JAR" | grep -q 'com/arlight/tetris/world/ArenaMatchListener.class'
          jar tf "$JAR" | grep -q 'com/arlight/tetris/world/ArenaDisplayManager.class'
          jar tf "$JAR" | grep -q 'com/arlight/tetris/stats/TetrisStatsStore.class'
          cp "$JAR" ArlightTetris-0.5.0.jar
          sha256sum ArlightTetris-0.5.0.jar

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ArlightTetris-0.5.0
          path: ArlightTetris-0.5.0.jar
          if-no-files-found: error
          retention-days: 7
