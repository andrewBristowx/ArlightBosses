name: Build ArlightTetris 0.5.0 Clean 2

on:
  workflow_dispatch:
  push:
    branches:
      - agent/compile-arlighttetris-0.5.0-build
    paths:
      - 'arlighttetris050/clean00.b64'
      - '.github/workflows/build-arlighttetris-050-clean2.yml'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Reconstruct source with clean first fragment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work/arlighttetris
          mkdir -p work/arlighttetris

          {
            cat arlighttetris050/clean00.b64
            cat arlighttetris050/tiny01.b64
            cat arlighttetris050/tiny02.b64
            cat arlighttetris050/tiny03.b64
            cat arlighttetris050/tiny04.b64
            cat arlighttetris050/tiny05.b64
            cat arlighttetris050/tiny06.b64
            cat arlighttetris050/tiny07.b64
            cat arlighttetris050/tiny08.b64
            cat arlighttetris050/tiny09.b64
            cat arlighttetris050/tiny10.b64
            cat arlighttetris050/tiny11.b64
          } | tr -d '\r\n\t ' | base64 --decode > /tmp/ArlightTetris-0.5.0-COMPILE.tar.gz

          echo 'a44db4e7896f3ae05590d60459b900e1d18e64ed2584512442e70fde5fbd4841  /tmp/ArlightTetris-0.5.0-COMPILE.tar.gz' | sha256sum -c -
          tar -xzf /tmp/ArlightTetris-0.5.0-COMPILE.tar.gz -C work/arlighttetris

          mkdir -p work/arlighttetris/src/main/resources/assets/arlighttetris/textures/gui
          echo 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=' | base64 --decode > work/arlighttetris/src/main/resources/assets/arlighttetris/textures/gui/tetris_waiting_background.png

          test -f work/arlighttetris/build.gradle
          test -f work/arlighttetris/settings.gradle
          grep -q "version = '0.5.0'" work/arlighttetris/build.gradle

      - name: Build ArlightTetris
        working-directory: work/arlighttetris
        run: gradle --no-daemon clean build --stacktrace

      - name: Verify final JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find work/arlighttetris/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*javadoc*' | head -n 1)"
          test -n "$JAR"
          cp "$JAR" work/ArlightTetris-0.5.0.jar
          jar tf work/ArlightTetris-0.5.0.jar | grep -q 'com/arlight/tetris/world/TetrisArenaBuilder.class'
          jar tf work/ArlightTetris-0.5.0.jar | grep -q 'com/arlight/tetris/stats/TetrisStatsStore.class'

      - name: Upload ArlightTetris JAR
        uses: actions/upload-artifact@v4
        with:
          name: ArlightTetris-0.5.0
          path: work/ArlightTetris-0.5.0.jar
          if-no-files-found: error
          retention-days: 7
