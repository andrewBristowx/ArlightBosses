name: Build ArlightTetris 0.5.0 Slim

on:
  workflow_dispatch:
  push:
    branches:
      - agent/compile-arlighttetris-0.5.0-build
    paths:
      - 'arlighttetris050/slim*.b64'
      - '.github/workflows/build-arlighttetris-050-slim.yml'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Reconstruct verified source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work/arlighttetris /tmp/arlight-parts
          mkdir -p work/arlighttetris /tmp/arlight-parts

          echo 'd1f9cb7e721371a7954311b56aa702721e4e2de64156caa3c8b674f29a931264  arlighttetris050/slim00.b64' | sha256sum -c -
          echo '184f99546d936b27e930ab402a37b0a7394a7737a672f21ade21c7789ff517a0  arlighttetris050/slim01.b64' | sha256sum -c -
          echo 'd9b048f054a7678d6d77a4f443b05c131be94bc7ab9f1778b17cfcf6f3b3fd65  arlighttetris050/slim02_00.b64' | sha256sum -c -
          echo '8538e6bd73bb861535f13e75db8ebf4b4d1abeac960b90cd5883581b43a56870  arlighttetris050/slim02_01.b64' | sha256sum -c -
          echo '75ef6b3582f3c3796be0bf04e658188c6c3bdcf04493dff79079624c0d1508fb  arlighttetris050/slim02_02.b64' | sha256sum -c -
          echo 'f5c8feb20d05cf2be4f00564ccb78d04846747b229aac37ab145ca960939be21  arlighttetris050/slim02_03.b64' | sha256sum -c -
          echo '1347fed4b960c4531cc4be7d4780ab3c5cdedaeb5909cf1fd16cee6bf6b1c3b2  arlighttetris050/slim03.b64' | sha256sum -c -

          cat arlighttetris050/slim02_*.b64 > /tmp/slim02.b64
          echo '4fa60f882ccacd6df46037684a655cc5e48bf7d2707ecd678025c829ee37c98e  /tmp/slim02.b64' | sha256sum -c -

          tr -d '\r\n\t ' < arlighttetris050/slim00.b64 | base64 --decode > /tmp/arlight-parts/00.bin
          tr -d '\r\n\t ' < arlighttetris050/slim01.b64 | base64 --decode > /tmp/arlight-parts/01.bin
          tr -d '\r\n\t ' < /tmp/slim02.b64 | base64 --decode > /tmp/arlight-parts/02.bin
          tr -d '\r\n\t ' < arlighttetris050/slim03.b64 | base64 --decode > /tmp/arlight-parts/03.bin
          cat /tmp/arlight-parts/*.bin > /tmp/ArlightTetris-0.5.0-SLIM.tar.gz

          echo '4b0142065d485d61811c06b3df40415234d955a9e132676cb933f0eb8890eead  /tmp/ArlightTetris-0.5.0-SLIM.tar.gz' | sha256sum -c -
          tar -xzf /tmp/ArlightTetris-0.5.0-SLIM.tar.gz -C work/arlighttetris

          mkdir -p work/arlighttetris/src/main/resources/assets/arlighttetris/textures/gui
          echo 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=' | base64 --decode > work/arlighttetris/src/main/resources/assets/arlighttetris/textures/gui/tetris_waiting_background.png

          test -f work/arlighttetris/build.gradle
          test -f work/arlighttetris/settings.gradle
          grep -q "version = '0.5.0'" work/arlighttetris/build.gradle
          grep -q 'findEnteredPod' work/arlighttetris/src/main/java/com/arlight/tetris/world/TetrisArena.java
          grep -q 'TetrisStatsStore' work/arlighttetris/src/main/java/com/arlight/tetris/stats/TetrisStatsStore.java
          grep -q 'getGravityIntervalTicks' work/arlighttetris/src/main/java/com/arlight/tetris/game/GameSession.java

      - name: Build ArlightTetris
        working-directory: work/arlighttetris
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon clean build --stacktrace 2>&1 | tee /tmp/arlighttetris-050-build.log

      - name: Verify final JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find work/arlighttetris/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*javadoc*' | head -n 1)"
          test -n "$JAR"
          cp "$JAR" work/ArlightTetris-0.5.0.jar
          jar tf work/ArlightTetris-0.5.0.jar | grep -q 'com/arlight/tetris/world/TetrisArenaBuilder.class'
          jar tf work/ArlightTetris-0.5.0.jar | grep -q 'com/arlight/tetris/world/ArenaMatchListener.class'
          jar tf work/ArlightTetris-0.5.0.jar | grep -q 'com/arlight/tetris/world/ArenaDisplayManager.class'
          jar tf work/ArlightTetris-0.5.0.jar | grep -q 'com/arlight/tetris/stats/TetrisStatsStore.class'
          jar tf work/ArlightTetris-0.5.0.jar | grep -q 'com/arlight/tetris/network/ClientboundArenaSidebarPacket.class'
          jar tf work/ArlightTetris-0.5.0.jar | grep -q 'assets/arlighttetris/textures/gui/tetris_waiting_background.png'
          unzip -p work/ArlightTetris-0.5.0.jar META-INF/neoforge.mods.toml | grep -Eq 'version[[:space:]]*=[[:space:]]*"0\.5\.0"'
          sha256sum work/ArlightTetris-0.5.0.jar

      - name: Upload ArlightTetris JAR
        uses: actions/upload-artifact@v4
        with:
          name: ArlightTetris-0.5.0
          path: work/ArlightTetris-0.5.0.jar
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ArlightTetris-0.5.0-diagnostics-slim
          path: /tmp/arlighttetris-050-build.log
          if-no-files-found: warn
          retention-days: 7
