name: Build ArlightTetris 0.3.2

on:
  workflow_dispatch:
  push:
    branches:
      - agent/compile-arlighttetris-0.3.2-build
    paths:
      - 'arlighttetris-build/source.part*'
      - 'arlighttetris-build/patches/**'
      - '.github/workflows/build-arlighttetris.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'arlighttetris-build/**'
      - '.github/workflows/build-arlighttetris.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore and verify ArlightTetris source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import re
          import zipfile
          from pathlib import Path

          paths = [Path('arlighttetris-build/source.part00'),
                   Path('arlighttetris-build/source.part01')]
          clean = [re.sub(rb'[^A-Za-z0-9+/=]', b'', p.read_bytes()) for p in paths]

          def padded(value: bytes) -> bytes:
              value = value.replace(b'=', b'')
              return value + b'=' * ((-len(value)) % 4)

          candidates = []
          # Formato 1: fragmentos de una única cadena Base64.
          candidates.append(('continuous', base64.b64decode(padded(b''.join(clean)), validate=False)))
          # Formato 2: cada fragmento codifica una porción binaria independiente.
          try:
              candidates.append(('independent', b''.join(
                  base64.b64decode(padded(part), validate=False) for part in clean)))
          except Exception:
              pass

          output = Path('/tmp/arlighttetris.zip')
          for mode, data in candidates:
              output.write_bytes(data)
              try:
                  with zipfile.ZipFile(output) as archive:
                      if archive.testzip() is None and 'arlighttetris/build.gradle' in archive.namelist():
                          print(f'Reconstrucción válida: {mode}, bytes={len(data)}')
                          break
              except Exception as exc:
                  print(f'Candidato {mode} inválido: {exc}')
          else:
              raise SystemExit('Ningún método reconstruyó un ZIP válido')
          PY

          mkdir -p work
          unzip -q /tmp/arlighttetris.zip -d work
          cp -a arlighttetris-build/patches/. work/arlighttetris/
          test -f work/arlighttetris/build.gradle
          test -f work/arlighttetris/settings.gradle
          grep -q "version = '0.3.2'" work/arlighttetris/build.gradle
          grep -q 'startSoloTest' work/arlighttetris/src/main/java/com/arlight/tetris/multiplayer/LobbyManager.java
          grep -q 'ArlightTetris registrado y verificado' work/arlighttetris/src/main/java/com/arlight/tetris/integration/ArlightCoreIntegration.java
          sha256sum /tmp/arlighttetris.zip

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build ArlightTetris
        working-directory: work/arlighttetris
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon clean build --stacktrace 2>&1 | tee /tmp/arlighttetris-build.log

      - name: Verify final JAR
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find work/arlighttetris/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*javadoc*' | head -n 1)"
          test -n "$JAR"
          jar tf "$JAR" | grep -q 'com/arlight/tetris/integration/ArlightCoreIntegration.class'
          jar tf "$JAR" | grep -q 'com/arlight/tetris/TetrisCommands.class'
          unzip -p "$JAR" META-INF/neoforge.mods.toml | grep -q 'version="0.3.2"'
          cp "$JAR" work/ArlightTetris-0.3.2.jar
          sha256sum work/ArlightTetris-0.3.2.jar

      - name: Upload ArlightTetris JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ArlightTetris-0.3.2
          path: work/ArlightTetris-0.3.2.jar
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ArlightTetris-0.3.2-diagnostics
          path: /tmp/arlighttetris-build.log
          if-no-files-found: warn
          retention-days: 7
