name: Build ArlightTetris 0.3.0

on:
  workflow_dispatch:
  push:
    branches:
      - agent/compile-arlighttetris-v0.3.0
    paths:
      - 'arlighttetris-build/chunks/**'
      - 'arlighttetris-build/patches/**'
      - '.github/workflows/build-arlighttetris.yml'
  pull_request:
    branches:
      - agent/compile-arlighttetris-v0.3.0
    paths:
      - 'arlighttetris-build/**'
      - '.github/workflows/build-arlighttetris.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Checkout ArlightCore 1.22.0
        uses: actions/checkout@v4
        with:
          repository: andrewBristowx/ArlightCore
          ref: agent/core-1.22.0-safe-world-transactions
          path: arlightcore

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore and verify ArlightTetris source
        shell: bash
        run: |
          set -euo pipefail
          cat arlighttetris-build/chunks/part* | tr -d '[:space:]' > /tmp/arlighttetris.b64
          base64 --decode /tmp/arlighttetris.b64 > /tmp/arlighttetris.zip
          echo '2dd4701be375b1758cc44714dca8018fc2ba34209ed0eb24109a2a5fdd870603  /tmp/arlighttetris.zip' | sha256sum --check -
          mkdir -p work
          unzip -q /tmp/arlighttetris.zip -d work
          if [ -d arlighttetris-build/patches ]; then
            cp -a arlighttetris-build/patches/. work/arlighttetris/
          fi
          test -f work/arlighttetris/build.gradle
          test -f work/arlighttetris/settings.gradle

      - name: Install ArlightCore 1.22.0 locally
        shell: bash
        run: |
          set -o pipefail
          mvn -B -f arlightcore/pom.xml -DskipTests install 2>&1 | tee /tmp/arlightcore-build.log

      - name: Build ArlightTetris
        working-directory: work/arlighttetris
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon clean build --stacktrace 2>&1 | tee /tmp/arlighttetris-build.log

      - name: Show generated files
        if: success()
        run: find work/arlighttetris/build/libs -maxdepth 1 -type f -printf '%f\n'

      - name: Upload ArlightTetris JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ArlightTetris-0.3.0
          path: work/arlighttetris/build/libs/*.jar
          if-no-files-found: error
          retention-days: 7

      - name: Record build status and logs
        if: always() && github.event_name == 'push'
        shell: bash
        env:
          BUILD_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p arlighttetris-results
          {
            echo "run_id=${RUN_ID}"
            echo "run_attempt=${RUN_ATTEMPT}"
            echo "status=${BUILD_STATUS}"
            echo "commit=${GITHUB_SHA}"
          } > arlighttetris-results/status.txt
          {
            if [ -f /tmp/arlightcore-build.log ]; then
              echo '===== ARLIGHTCORE ====='
              tail -n 500 /tmp/arlightcore-build.log
            fi
            if [ -f /tmp/arlighttetris-build.log ]; then
              echo '===== ARLIGHTTETRIS ====='
              tail -n 1200 /tmp/arlighttetris-build.log
            fi
          } > arlighttetris-results/last-build.log
          if compgen -G 'work/arlighttetris/build/libs/*.jar' > /dev/null; then
            sha256sum work/arlighttetris/build/libs/*.jar > arlighttetris-results/jars.sha256
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arlighttetris-results
          git commit -m "Registrar compilación ArlightTetris ${RUN_ID} [skip ci]" || exit 0
          git push origin HEAD:agent/compile-arlighttetris-v0.3.0
