name: Compilar Parkour Assets 1.1.0 y Plugin 1.7.0

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  actions: read

jobs:
  build:
    if: contains(github.event.comment.body, '/build-parkour-assets-1.1.0')
    runs-on: ubuntu-latest
    timeout-minutes: 110

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Registrar ejecución
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/run-info
          printf '%s\n' "$GITHUB_RUN_ID" > .github/run-info/PARKOUR_ASSETS_RUN_ID.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/run-info/PARKOUR_ASSETS_RUN_ID.txt
          if ! git diff --cached --quiet; then
            git commit -m "Registrar build Parkour Assets ${GITHUB_RUN_ID}"
            git push origin HEAD:main
          fi

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Descargar fuentes y ArlightCore
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 3 \
            'https://drive.usercontent.google.com/download?id=18wimLoOo7iogp5Ct3xf_dOBtgZsJZTLb&export=download&confirm=t' \
            -o /tmp/ArlightParkourAssets-source.zip
          curl --fail --location --retry 5 --retry-delay 3 \
            'https://drive.usercontent.google.com/download?id=14RLEPr8scILvcSzZqYvCe7XmvWoA3MX2&export=download&confirm=t' \
            -o /tmp/ArlightParkour-source.zip
          curl --fail --location --retry 5 --retry-delay 3 \
            'https://drive.usercontent.google.com/download?id=1b7JV5Y8ymeKdIZIGXwoFQA2JOB9izFqK&export=download&confirm=t' \
            -o /tmp/ArlightCore-1.25.4.jar
          mkdir -p /tmp/arlight-assets /tmp/arlight-parkour
          unzip -q /tmp/ArlightParkourAssets-source.zip -d /tmp/arlight-assets
          unzip -q /tmp/ArlightParkour-source.zip -d /tmp/arlight-parkour
          ASSETS_ROOT="$(find /tmp/arlight-assets -type f -name build.gradle -printf '%h\n' | head -n 1)"
          PARKOUR_ROOT="$(find /tmp/arlight-parkour -type f -name pom.xml -printf '%h\n' | head -n 1)"
          test -n "$ASSETS_ROOT"
          test -n "$PARKOUR_ROOT"
          echo "ASSETS_ROOT=$ASSETS_ROOT" >> "$GITHUB_ENV"
          echo "PARKOUR_ROOT=$PARKOUR_ROOT" >> "$GITHUB_ENV"
          sed -i 's#gradle-[0-9.]*-bin.zip#gradle-8.14.3-bin.zip#' "$ASSETS_ROOT/gradle/wrapper/gradle-wrapper.properties"
          chmod +x "$ASSETS_ROOT/gradlew"
          mvn -B -ntp install:install-file \
            -Dfile=/tmp/ArlightCore-1.25.4.jar \
            -DgroupId=com.arlight -DartifactId=ArlightCore \
            -Dversion=1.25.4 -Dpackaging=jar

      - name: Compilar ArlightParkourAssets
        shell: bash
        run: |
          set -euo pipefail
          cd "$ASSETS_ROOT"
          ./gradlew --no-daemon clean build

      - name: Compilar ArlightParkour con Paper API real
        shell: bash
        run: |
          set -euo pipefail
          cd "$PARKOUR_ROOT"
          mvn -B -ntp clean package -DskipTests

      - name: Validar y reunir JARs
        shell: bash
        run: |
          set -euo pipefail
          ASSETS_JAR="$(find "$ASSETS_ROOT/build/libs" -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*javadoc*' -print -quit)"
          PARKOUR_JAR="$(find "$PARKOUR_ROOT/target" -maxdepth 1 -type f -name '*.jar' ! -name 'original-*' ! -name '*sources*' -print -quit)"
          test -n "$ASSETS_JAR"
          test -n "$PARKOUR_JAR"
          unzip -p "$ASSETS_JAR" META-INF/neoforge.mods.toml | grep 'version="1.1.0"'
          jar tf "$ASSETS_JAR" | grep 'assets/arlightparkourassets/geo/hammer.geo.json'
          jar tf "$ASSETS_JAR" | grep 'assets/arlightparkourassets/animations/rotating_bar.animation.json'
          unzip -p "$PARKOUR_JAR" plugin.yml | grep "version: '1.7.0'"
          javap -classpath "$PARKOUR_JAR:/tmp/ArlightCore-1.25.4.jar" -p com.arlight.parkour.ParkourAssetBridge | grep 'setPhase'
          javap -classpath "$PARKOUR_JAR:/tmp/ArlightCore-1.25.4.jar" -p com.arlight.parkour.DynamicObstacleManager | grep 'ParkourAssetBridge'
          if jar tf "$ASSETS_JAR" | grep -q '^net/minecraft/'; then exit 1; fi
          if jar tf "$PARKOUR_JAR" | grep -q '^org/bukkit/'; then exit 1; fi
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$ASSETS_JAR" "$GITHUB_WORKSPACE/dist/ArlightParkourAssets-1.1.0.jar"
          cp "$PARKOUR_JAR" "$GITHUB_WORKSPACE/dist/ArlightParkour-1.7.0-ASSETS-INTEGRATION.jar"
          sha256sum "$GITHUB_WORKSPACE/dist/ArlightParkourAssets-1.1.0.jar" \
            "$GITHUB_WORKSPACE/dist/ArlightParkour-1.7.0-ASSETS-INTEGRATION.jar" \
            > "$GITHUB_WORKSPACE/dist/SHA256.txt"

      - name: Subir entrega compilada
        uses: actions/upload-artifact@v4
        with:
          name: ArlightParkour-1.7.0-and-Assets-1.1.0
          path: dist/*
          if-no-files-found: error
          retention-days: 30
