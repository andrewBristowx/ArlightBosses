name: Compilar ArlightBosses

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Registrar ejecución
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/run-info
          printf '%s\n' "$GITHUB_RUN_ID" > .github/run-info/LAST_RUN_ID.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/run-info/LAST_RUN_ID.txt
          if ! git diff --cached --quiet; then
            git commit -m "Registrar build ${GITHUB_RUN_ID}"
            git push origin HEAD:main
          fi

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Compilar con Gradle
        run: gradle --no-daemon clean build

      - name: Reunir JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -exec cp {} dist/ \;
          test -n "$(find dist -maxdepth 1 -type f -name '*.jar' -print -quit)"
          ls -lh dist

      - name: Subir JAR compilado
        uses: actions/upload-artifact@v4
        with:
          name: ArlightBosses-1.21.0-JAR
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 30
