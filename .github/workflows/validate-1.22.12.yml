name: Validar ArlightBosses 1.22.12

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Descargar base 1.22.10
        run: |
          set -euo pipefail
          URL1='https://drive.usercontent.google.com/download?id=1LwEsqsXV5i4BdoaeWo1FkFBOn6wEoL-A&export=download&confirm=t'
          URL2='https://drive.google.com/uc?export=download&id=1LwEsqsXV5i4BdoaeWo1FkFBOn6wEoL-A&confirm=t'
          curl -L --fail --retry 3 "$URL1" -o /tmp/base.zip || curl -L --fail --retry 3 "$URL2" -o /tmp/base.zip
          unzip -t /tmp/base.zip | tail -1
          mkdir -p /tmp/buildsrc
          unzip -q /tmp/base.zip -d /tmp/buildsrc
      - name: Aplicar revisión 1.22.12
        run: |
          set -euo pipefail
          cat patches/boss.part* > /tmp/change.patch
          cd /tmp/buildsrc
          patch -p1 --batch < /tmp/change.patch
      - name: Compilar
        working-directory: /tmp/buildsrc
        run: gradle --no-daemon clean build
      - name: Validar JAR
        run: |
          set -euo pipefail
          test -f /tmp/buildsrc/build/libs/ArlightBosses-1.22.12.jar
          jar tf /tmp/buildsrc/build/libs/ArlightBosses-1.22.12.jar >/dev/null
          unzip -p /tmp/buildsrc/build/libs/ArlightBosses-1.22.12.jar META-INF/neoforge.mods.toml | grep -F 'version="1.22.12"'
      - name: Subir JAR
        uses: actions/upload-artifact@v4
        with:
          name: ArlightBosses-1.22.12
          path: /tmp/buildsrc/build/libs/ArlightBosses-1.22.12.jar
          if-no-files-found: error
          retention-days: 3
